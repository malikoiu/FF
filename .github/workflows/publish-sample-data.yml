name: Publish sample data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    name: Add CSV to release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Upload sample CSV to latest app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload unsigned-7 sample-data.csv --clobber
